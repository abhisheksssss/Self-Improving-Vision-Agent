[project]
name = "vision-agent"
version = "0.1.0"
description = "SIVAC - Self-Improving Vision Agent for Autonomous Computer Use"
readme = "README.md"
authors = [
    { name = "abhisheksssss", email = "abhisheksahu97521@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.30",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.1",
    "openai>=1.14.0",
    "httpx>=0.27.0",
    "pyautogui>=0.9.54",
    "playwright>=1.42.0",
    "pywinauto>=0.6.8; platform_system == 'Windows'",
    "uiautomation>=2.0.18; platform_system == 'Windows'",
    "mss>=9.0.1",
    "pillow>=10.2.0",
    "pytesseract>=0.3.10",
    "sqlalchemy>=2.0.28",
    "chromadb>=0.4.24",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
]

[project.scripts]
sivac = "vision_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_agent"]
